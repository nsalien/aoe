<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a2015">
  <title>Rijken van de Vallei</title>
  <meta name="description" content="Bouw samen met je bondgenoot een rijk op, en trek na drie weken vrede ten strijde.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 58V26h8v8h6V26h8v8h0V26h8v8h6v-8h8v32z' fill='%23b9b1a1'/%3E%3Cpath d='M28 58V44a4 4 0 0 1 8 0v14z' fill='%233d2a1a'/%3E%3Cpath d='M32 6v18' stroke='%233b2a18' stroke-width='2'/%3E%3Cpath d='M33 6h14l-4 5 4 5H33z' fill='%23d64545'/%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- iPhone/iPad: 'Zet op beginscherm' geeft een app met eigen icoon, volledig scherm en zonder adresbalk -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rijken">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="splash" class="splash"><div class="splash-inner"><div class="splash-crest" data-icon="castle"></div><div class="splash-title">Rijken van de Vallei</div><div class="splash-bar"><i></i></div></div></div>

  <!-- Aanmelden -->
  <section id="auth" class="screen">
    <canvas id="authCanvas"></canvas>
    <div class="auth-card">
      <div class="logo">
        <span class="logo-crest" data-icon="castle"></span>
        <h1>Rijken van de Vallei</h1>
        <p class="tagline">Drie weken bouwen. Eén week oorlog.</p>
      </div>
      <div id="authInfo" class="auth-info"></div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-action="authTab" data-tab="login">Aanmelden</button>
        <button class="tab" data-action="authTab" data-tab="register">Nieuw rijk stichten</button>
      </div>
      <form id="loginForm" class="auth-form">
        <label>Naam<input name="name" autocomplete="username" required maxlength="20"></label>
        <label>Wachtwoord<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary big" type="submit">Naar mijn rijk</button>
      </form>
      <form id="registerForm" class="auth-form" hidden>
        <label>Naam<input name="name" autocomplete="username" required minlength="3" maxlength="20"></label>
        <label>Wachtwoord<input name="password" type="password" autocomplete="new-password" required minlength="6"></label>
        <label>Naam van je burcht <span class="opt">(optioneel)</span><input name="townName" maxlength="24" placeholder="bv. Eikenhof"></label>
        <label id="joinCodeRow" hidden>Deelnamecode<input name="joinCode" autocomplete="off"></label>
        <div class="civ-pick"><div class="civ-pick-title">Kies je volk</div><div id="civPicker" class="civ-grid"></div></div>
        <p class="hint">Je wordt automatisch gekoppeld aan een bondgenoot. Samen staan jullie sterker!</p>
        <button class="btn primary big" type="submit">Sticht mijn rijk</button>
      </form>
      <p id="authError" class="error" role="alert"></p>
      <p id="appLink" class="app-link"><a href="/rijken-van-de-vallei.apk" download>Android-app downloaden</a></p>
    </div>
  </section>

  <!-- Spel -->
  <section id="game" class="screen" hidden>
    <header id="topbar">
      <div class="brand"><span class="logo-crest sm" data-icon="castle"></span><span class="brand-name">Rijken</span></div>
      <div id="resbar" class="resbar"></div>
      <div id="phase" class="phase"></div>
      <div id="alert" class="alert" hidden></div>
    </header>
    <nav id="nav">
      <button class="navbtn active" data-action="view" data-view="town" title="Mijn stad"><span class="ni" data-icon="castle"></span><span>Stad</span></button>
      <button class="navbtn" data-action="view" data-view="world" title="Wereldkaart"><span class="ni" data-icon="map"></span><span>Wereld</span></button>
      <button class="navbtn" data-action="reports" title="Rapporten"><span class="ni" data-icon="scroll"></span><span>Rapporten</span><b id="badgeReports" class="badge" hidden></b></button>
      <button class="navbtn" data-action="team" title="Team en chat"><span class="ni" data-icon="team"></span><span>Team</span><b id="badgeChat" class="badge dot" hidden></b></button>
      <button class="navbtn" data-action="leaderboard" title="Ranglijst"><span class="ni" data-icon="trophy"></span><span>Ranglijst</span></button>
      <button class="navbtn" data-action="help" title="Hoe speel je?"><span class="ni" data-icon="book"></span><span>Hulp</span></button>
      <button class="navbtn bottom" data-action="logout" title="Afmelden"><span class="ni" data-icon="door"></span><span>Uit</span></button>
    </nav>
    <main id="stage">
      <canvas id="townCanvas"></canvas>
      <canvas id="worldCanvas" hidden></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div id="viewTitle" class="view-title"></div>
      <div class="hud">
        <button class="hudbtn" data-action="zoom" data-dir="1" title="Inzoomen" data-icon="plus"></button>
        <button class="hudbtn" data-action="zoom" data-dir="-1" title="Uitzoomen" data-icon="minus"></button>
        <button class="hudbtn" data-action="home" title="Naar mijn stad" data-icon="home"></button>
        <button class="hudbtn" id="lightBtn" data-action="lightMode" title="Dag en nacht"></button>
      </div>
      <div id="placeHint" class="place-hint" hidden></div>
      <div id="buildwrap" class="buildwrap">
        <div class="bb-row">
          <button id="bbToggle" class="bb-toggle" data-action="toggleBuildbar" aria-expanded="true"></button>
          <div id="selActions" class="sel-actions" hidden></div>
        </div>
        <div id="buildbar" class="buildbar"></div>
      </div>
      <button id="panelToggle" class="panel-toggle" data-action="togglePanel" data-icon="menu"> Details</button>
    </main>
    <aside id="panel" class="panel"></aside>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" data-action="closeModal" aria-label="Sluiten" data-icon="close"></button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
