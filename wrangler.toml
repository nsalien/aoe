# Configuratie voor Cloudflare Pages + D1.
# database_id hoef je niet zelf in te vullen: scripts/deploy.sh zoekt (of maakt) de database
# en vult de juiste id in tijdens elke deploy. Lokaal werkt de nul-id gewoon.
name = "rijken-van-de-vallei"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "rijken-db"
database_id = "00000000-0000-0000-0000-000000000000"
